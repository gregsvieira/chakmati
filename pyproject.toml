[project]
name = "chakmati"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "lxml>=6.1.3",
  "trafilatura>=2.3.1",
  "icalendar>=7.3.0",
  "recurring-ical-events>=3.8.2",
  "pyobjc-framework-eventkit>=12.2.2 ; sys_platform == 'darwin'",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
laya = ["laya"]
voice = ["piper-tts>=1.8.0", "av>=14,<17"]            # enhanced voice and WhatsApp voice notes
listen = ["faster-whisper>=1.2.1", "av>=14,<17"]      # speech recognition for "talk to Chakmati"
browser = [
    "playwright>=1.49",
]
documents = [
    "openpyxl>=3.1",
    "pypdf>=5", "pypdfium2>=4", "pillow>=10", "pyobjc-framework-vision>=12 ; sys_platform == 'darwin'", "pyobjc-framework-quartz>=12 ; sys_platform == 'darwin'",
    "python-docx>=1.1",
    "python-pptx>=1.0", "pypdf>=5",
]
ocr = [
    "pillow>=10",
    "pyobjc-framework-quartz>=12 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12 ; sys_platform == 'darwin'",
    "pypdfium2>=4",
    "rapidocr-onnxruntime>=1.3 ; sys_platform != 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0", "piper-tts>=1.8.0", "faster-whisper>=1.2.1", "av>=14,<17"]  # the extras too, so every test runs

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liteagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
