[project]
name = "lite-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "lxml>=6.1.3",
  "trafilatura>=2.3.1",
  "icalendar>=7.3.0",
  "recurring-ical-events>=3.8.2",
  "pyobjc-framework-eventkit>=12.2.2 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
laya = ["laya"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liteagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
