name: release

# Builds the installers on each system and publishes them as a GitHub Release.
# Runs when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0), or by hand from the Actions tab with a tag name.
#
# Each build uploads its installer straight to the release (not through workflow artifacts, which have a storage quota that fills up).
# The release is created as a draft, and only published when all four installers are in it: a failed build never leaves a half-empty release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). It is created on the selected branch if it does not exist.'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write              # create the release and upload its files

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release (if it does not exist yet)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || gh release list --limit 100 --json tagName,isDraft -q '.[]|select(.isDraft and .tagName=="'"$TAG"'")|.tagName' | grep -q .; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --draft --title "Chakmati ${TAG#v}" --target "${{ github.sha }}" \
              --notes "Instaladores do Chakmati para Mac (Apple e Intel), Windows e Ubuntu. Ainda não são assinados: o sistema mostra um aviso na primeira abertura (no Mac, clique com o botão direito e escolha Abrir)."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, platform: darwin, arch: arm64, flags: '--mac pkg --arm64', files: 'dist/*.pkg' }
          - { os: macos-latest, platform: darwin, arch: x64, flags: '--mac pkg --x64', files: 'dist/*.pkg' }
          - { os: windows-latest, platform: win32, arch: x64, flags: '--win nsis --x64', files: 'dist/*.exe' }
          - { os: ubuntu-latest, platform: linux, arch: x64, flags: '--linux deb --x64', files: 'dist/*.deb' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # the version in the file names comes from the tag (v0.2.0 -> 0.2.0)
      - run: npm pkg set version="${TAG#v}"
      - run: node scripts/fetch-uv.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - run: npx electron-builder ${{ matrix.flags }} --publish never
      - name: Upload the installer to the release
        run: |
          ls -la ${{ matrix.files }}
          gh release upload "$TAG" ${{ matrix.files }} --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (all installers are in it)
        run: gh release edit "$TAG" --draft=false --latest
