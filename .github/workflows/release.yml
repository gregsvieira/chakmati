name: release

# Builds the installers on each system and publishes them as a GitHub Release.
# Runs when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0), or by hand from the Actions tab with a tag name.
#
# Each build uploads its installer straight to the release (not through workflow artifacts, which have a storage quota that fills up).
# The four builds are independent: one that fails does not stop or cancel the others. The release is created as a draft and published once the builds
# finish, with whatever installers were built (it needs at least one); the failed ones are fixed and re-run with "Re-run failed jobs", which adds them to the release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). It is created on the selected branch if it does not exist.'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write              # create the release and upload its files; the site-links job pushes to main
  actions: write               # the site-links job starts the site publish

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release (if it does not exist yet)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || gh release list --limit 100 --json tagName,isDraft -q '.[]|select(.isDraft and .tagName=="'"$TAG"'")|.tagName' | grep -q .; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --draft --title "Chakmati ${TAG#v}" --target "${{ github.sha }}" \
              --notes "Instaladores do Chakmati para Mac (Apple e Intel), Windows e Ubuntu. Ainda não são assinados: o sistema mostra um aviso na primeira abertura (no Mac, clique com o botão direito e escolha Abrir)."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false         # a failure on one system never cancels the others
      matrix:
        include:
          - { os: macos-latest, platform: darwin, arch: arm64, flags: '--mac pkg --arm64', files: 'dist/*.pkg' }
          - { os: macos-latest, platform: darwin, arch: x64, flags: '--mac pkg --x64', files: 'dist/*.pkg' }
          - { os: windows-latest, platform: win32, arch: x64, flags: '--win nsis --x64', files: 'dist/*.exe' }
          - { os: ubuntu-latest, platform: linux, arch: x64, flags: '--linux deb --x64', files: 'dist/*.deb' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # the version in the file names comes from the tag (v0.2.0 -> 0.2.0)
      - run: npm pkg set version="${TAG#v}"
        shell: bash
      - run: node scripts/fetch-uv.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - run: npx electron-builder ${{ matrix.flags }} --publish never
      - name: Upload the installer to the release
        shell: bash
        run: |
          ls -la ${{ matrix.files }}
          gh release upload "$TAG" ${{ matrix.files }} --clobber

  publish:
    needs: build
    if: ${{ !cancelled() }}      # also when a build failed: the installers that were built still go out
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release with the installers that were built
        run: |
          COUNT=$(gh release view "$TAG" --json assets -q '.assets|length' 2>/dev/null || gh api "repos/$GH_REPO/releases" --paginate -q ".[]|select(.tag_name==\"$TAG\")|.assets|length")
          echo "Installers in the release: $COUNT"
          if [ "${COUNT:-0}" -lt 1 ]; then echo "::error::No installer was built, nothing to publish."; exit 1; fi
          gh release edit "$TAG" --draft=false --latest
          if [ "${{ needs.build.result }}" != "success" ]; then echo "::warning::Some builds failed: the release has only the installers that were built. Use \"Re-run failed jobs\" to add the rest."; fi

  # The download buttons of the site point straight at this version's files. Only for the release that is now "latest", so re-running an
  # older tag never moves the site back. The push is by the Actions token, which does not start other workflows, so the site publish is started by hand.
  site-links:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}   # without !cancelled() a failed build upstream would skip this job even though the release was published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Point the site buttons at this release
        run: |
          LATEST=$(gh release view --json tagName -q .tagName)
          if [ "$LATEST" != "$TAG" ]; then echo "$TAG is not the latest release ($LATEST): the site is left as it is."; exit 0; fi
          python3 scripts/set_download_links.py "$TAG"
          if git diff --quiet; then echo "The site already points at $TAG."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "site: download buttons point at $TAG"
          git push origin HEAD:main
          gh workflow run publish-site
