appId: com.chakmati.app
productName: Chakmati
# one unambiguous file name per system and processor: the two Mac builds (Apple chip and Intel) and the release page never collide
artifactName: Chakmati-${version}-${os}-${arch}.${ext}
# The workflow publishes with `gh release upload`, not with electron-builder. Without this, a GH_TOKEN in the environment makes electron-builder try its own GitHub publishing,
# fail to find the repository, and crash building the update info of the .exe and .deb ("Cannot read properties of null (reading 'channel')").
publish: null
directories:
  output: dist
  buildResources: build
files:
  - src/**
  - package.json
asar: true
# The engine travels as plain files (read-only); the wizard creates the Python environment in the app's data folder.
extraResources:
  - from: ../pyproject.toml
    to: engine/pyproject.toml
  - from: ../uv.lock
    to: engine/uv.lock
  - from: ../LICENSE                 # the engine's project file lists these two as its license files (the build of the engine needs them next to pyproject.toml)
    to: engine/LICENSE
  - from: ../NOTICE
    to: engine/NOTICE
  - from: ../src
    to: engine/src
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: ../LICENSE                 # what Apache-2.0 asks to travel with a copy, and the notices of what is inside
    to: legal/LICENSE
  - from: ../NOTICE
    to: legal/NOTICE
  - from: ../THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: ../DISCLAIMER.md
    to: legal/DISCLAIMER.md
  - from: ../PRIVACY.md
    to: legal/PRIVACY.md
  - from: build/bin
    to: bin
    filter:
      - uv
      - uv.exe
mac:
  category: public.app-category.productivity
  identity: null            # no signing certificate yet: the installers are unsigned (macOS shows a warning on first open)
  extendInfo:
    NSCalendarsUsageDescription: O Chakmati lê e cria compromissos na sua agenda quando você pede.
    NSCalendarsFullAccessUsageDescription: O Chakmati lê e cria compromissos na sua agenda quando você pede.
    NSMicrophoneUsageDescription: O Chakmati usa o microfone para ouvir você quando "Falar com o Chakmati" está ligado.
  target:
    - target: pkg
pkg:
  installLocation: /Applications     # the app lands in Applications: it shows in Launchpad and Spotlight
  allowAnywhere: false
  allowCurrentUserHome: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true      # the app shows in the Start menu
  createDesktopShortcut: false       # the desktop shortcut is the person's choice, in the Chakmati's own wizard
  shortcutName: Chakmati
linux:
  category: Utility                  # the .deb installs a launcher in the applications menu
  executableName: chakmati
  maintainer: Gregory Vieira <89167868+gregsvieira@users.noreply.github.com>   # the .deb requires one; the GitHub no-reply address, not a personal e-mail
  target:
    - target: deb
      arch: [x64]
