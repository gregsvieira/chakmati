<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Chakmati</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="robot.css">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden" role="status" aria-live="polite" data-kind="system">
      <span class="rule"></span>
      <p id="bubble-text"></p>
      <i class="tail"></i>
    </div>
    <button id="robot" type="button" aria-label="Abrir o painel do Chakmati"></button>
    <div id="mic-badge" class="hidden" role="status" aria-label="Chakmati está ouvindo o seu comando"><span></span></div>
  </div>
  <script src="../lib/speech-text.js"></script>
  <script src="voice.js"></script>
  <script src="robot.js"></script>
  <script src="widget.js"></script>
</body>
</html>
