<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; media-src data:; style-src 'self'; script-src 'self'">
  <title>Chakmati</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="robot.css">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden" role="status" aria-live="polite" data-kind="system">
      <span class="rule"></span>
      <p id="bubble-text"></p>
      <i class="tail"></i>
    </div>
    <button id="robot" type="button" aria-label="Abrir o painel do Chakmati"></button>
    <div id="approval-badge" role="status" aria-label="Nenhuma aprovação pendente"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 3.5h10a1.5 1.5 0 011.5 1.5v14A1.5 1.5 0 0117 20.5H7A1.5 1.5 0 015.5 19V5A1.5 1.5 0 017 3.5z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 12.4l2.2 2.2L15.2 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div id="mic-badge" class="hidden" role="status" aria-label="Chakmati está ouvindo o seu comando"><span></span></div>
  </div>
  <script src="../lib/speech-text.js"></script>
  <script src="voice.js"></script>
  <script src="robot.js"></script>
  <script src="widget.js"></script>
</body>
</html>
