<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Chakmati</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="robot.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="panel">
    <header id="head">
      <div id="head-robot"></div>
      <div class="head-text">
        <h1 id="title">Conectando…</h1>
        <p id="detail"></p>
      </div>
      <button id="close" type="button" aria-label="Fechar painel"><span></span></button>
    </header>

    <main id="content">
      <section id="decisions" hidden>
        <h2>Para você decidir</h2>
        <div id="decision-list"></div>
      </section>
      <section id="messages" hidden>
        <h2>Mensagens</h2>
        <div id="messages-body"></div>
      </section>
      <section id="agenda" hidden>
        <h2>Hoje na agenda</h2>
        <div id="agenda-body"></div>
      </section>
      <section id="recent">
        <h2>Avisos recentes</h2>
        <div id="recent-body"></div>
      </section>
      <section id="thread-section" hidden>
        <h2>Conversa</h2>
        <div id="thread" aria-live="polite"></div>
      </section>
    </main>

    <section id="settings-view" hidden>
      <div class="settings-head">
        <button type="button" id="back" class="ghost">Voltar</button>
        <h2>Ajustes</h2>
      </div>
      <div class="settings-body">
          <div class="group">
            <label class="switch"><input type="checkbox" id="set-whatsapp"><span class="track"></span>
              <span class="switch-text">WhatsApp
                <small id="wa-status">Ler, resumir e enviar mensagens (sempre com a sua aprovação).</small></span></label>
            <button type="button" id="wa-connect" class="ghost" hidden>Conectar WhatsApp (escanear QR)</button>
            <label class="switch"><input type="checkbox" id="set-calendar"><span class="track"></span>
              <span class="switch-text">Agenda
                <small>Ver e marcar compromissos no calendário do computador.</small></span></label>
            <p class="hint" id="engine-hint" hidden></p>
          </div>
          <label class="switch"><input type="checkbox" id="set-protect"><span class="track"></span>
            <span class="switch-text">Esconder do compartilhamento de tela
              <small>Pede ao sistema para deixar o Chakmati fora de gravações e compartilhamentos. Funciona no Windows e em parte do macOS: teste antes de compartilhar.</small></span></label>
          <label class="switch"><input type="checkbox" id="set-masked"><span class="track"></span>
            <span class="switch-text">Modo discreto
              <small>Avisos e listas sem nomes nem títulos. Os pedidos de aprovação sempre mostram o texto completo.</small></span></label>
          <label class="field">Humor do Chakmati
            <select id="set-mood">
              <option value="auto">Automático</option><option value="idle">Calmo</option><option value="alert">Alerta</option>
              <option value="thinking">Pensativo</option><option value="happy">Feliz</option>
            </select></label>
          <label class="field">Onde aparece o balão
            <select id="set-side">
              <option value="auto">Automático</option><option value="top">Em cima</option><option value="bottom">Embaixo</option>
              <option value="left">À esquerda</option><option value="right">À direita</option>
            </select></label>
          <button type="button" id="panic" class="ghost">Ocultar tudo agora</button>
          <p class="hint" id="hotkeys"></p>
        </div>
    </section>

    <footer id="foot">
      <div id="chips" role="group" aria-label="Atalhos"></div>
      <form id="composer" autocomplete="off">
        <textarea id="input" rows="1" maxlength="2000" placeholder="Peça algo ao Chakmati…" aria-label="Pedido ao Chakmati"></textarea>
        <button id="send" type="submit" aria-label="Enviar"><span></span></button>
      </form>
      <button type="button" id="open-settings" class="link">Ajustes</button>
    </footer>
  </div>
  <script src="../lib/reltime.js"></script>
  <script src="robot.js"></script>
  <script src="panel.js"></script>
</body>
</html>
